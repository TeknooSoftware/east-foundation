before_script:
  - make

.abstract_tests:
  image: $PHP_IMAGE:$PHP_VERSION
  script:
    - make test

test:8.4-lower:
  extends: .abstract_tests
  variables:
    PHP_VERSION: '8.4'
    DEPENDENCIES: lowest

test:8.4-upper:
  extends: .abstract_tests
  variables:
    PHP_VERSION: '8.4'
  script:
    - make test
    - make qa

test:8.5-lower:
  extends: .abstract_tests
  variables:
    PHP_VERSION: '8.5'
    DEPENDENCIES: lowest

test:8.5-upper:
  extends: .abstract_tests
  variables:
    PHP_VERSION: '8.5'
  script:
    - make test
    - make qa

test:frankenphp:
  image: dunglas/frankenphp:1.13-php8.5
  before_script:
    - install-php-extensions @composer pcntl zip
    #As php.ini-production : the stream must flush the output buffer of PHP
    - echo 'output_buffering = 4096' > "$PHP_INI_DIR/conf.d/output-buffering.ini"
    - make
  script:
    - php tests/frankenphp/check.php worker
    - php tests/frankenphp/check.php classic
